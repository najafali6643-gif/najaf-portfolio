<div id="cursor-demo" style="position: relative; width: 100%; height: 420px; background-color: #0d0d0d; border-radius: var(--radius); overflow: hidden; cursor: none; display: flex; align-items: center; justify-content: center; font-family: var(--font-sans);">

<div style="text-align: center; color: rgba(255,255,255,0.5); font-size: 14px; z-index: 1;">
  Move your mouse around<br/>
  <span id="hover-target" style="display: inline-block; margin-top: 20px; padding: 12px 28px; border: 1px solid rgba(255,255,255,0.2); border-radius: 999px; color: #fff; font-size: 13px; cursor: none;">Hover me</span>
</div>

<div id="cursor-ring" style="position: absolute; top: 0; left: 0; width: 36px; height: 36px; border: 1px solid rgba(255,255,255,0.6); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); transition: width 0.2s ease, height 0.2s ease, border-color 0.2s ease; z-index: 2;"></div>
<div id="cursor-dot" style="position: absolute; top: 0; left: 0; width: 6px; height: 6px; background: #fff; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 2;"></div>

</div>
<script>
(function() {
  const container = document.getElementById('cursor-demo');
  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  const target = document.getElementById('hover-target');

  const mouse = { x: 0, y: 0 };
  const ringPos = { x: 0, y: 0 };

  container.addEventListener('mousemove', (e) => {
    const rect = container.getBoundingClientRect();
    mouse.x = e.clientX - rect.left;
    mouse.y = e.clientY - rect.top;
    dot.style.left = mouse.x + 'px';
    dot.style.top = mouse.y + 'px';
  });

  target.addEventListener('mouseenter', () => {
    ring.style.width = '56px';
    ring.style.height = '56px';
    ring.style.borderColor = 'rgba(255,255,255,1)';
  });
  target.addEventListener('mouseleave', () => {
    ring.style.width = '36px';
    ring.style.height = '36px';
    ring.style.borderColor = 'rgba(255,255,255,0.6)';
  });

  function animate() {
    ringPos.x += (mouse.x - ringPos.x) * 0.15;
    ringPos.y += (mouse.y - ringPos.y) * 0.15;
    ring.style.left = ringPos.x + 'px';
    ring.style.top = ringPos.y + 'px';
    requestAnimationFrame(animate);
  }
  animate();
})();
</script>
